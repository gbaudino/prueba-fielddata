[project]
name = "agroclimate"
version = "1.1.0"
description = "Weather alert system for agriculture"
readme = "README.md"
authors = [
    { name = "gbaudino", email = "geremiasbaudino@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "pre-commit>=4.7.0",
    "httpx2>=2.16.0",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "E501"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.per-file-ignores]
"src/agroclimate/db/migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = true

[tool.coverage.run]
source = ["src/agroclimate"]
branch = true

[tool.semantic_release]
commit_parser = "conventional"
allow_zero_version = true
major_on_zero = true
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): {version}"
build_command = '''uv lock --upgrade-package "$PACKAGE_NAME" && git add uv.lock'''

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = ["build", "chore", "ci", "docs", "refactor", "revert", "style", "test"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = [
    '''^build(?:\([^)]*\))?: .+''',
    '''^chore(?:\([^)]*\))?: .+''',
    '''^ci(?:\([^)]*\))?: .+''',
    '''^docs(?:\([^)]*\))?: .+''',
    '''^refactor(?:\([^)]*\))?: .+''',
    '''^revert(?:\([^)]*\))?: .+''',
    '''^style(?:\([^)]*\))?: .+''',
    '''^test(?:\([^)]*\))?: .+''',
]

[tool.semantic_release.publish]
upload_to_vcs_release = false
