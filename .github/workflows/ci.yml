name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    env:
      APP_NAME: agroclimate
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      POSTGRES_DB: agroclimate
      POSTGRES_USER: agroclimate
      POSTGRES_PASSWORD: local-dev-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_POOL_SIZE: "5"
      POSTGRES_MAX_OVERFLOW: "5"
      POSTGRES_POOL_TIMEOUT_SECONDS: "30"
      POSTGRES_POOL_RECYCLE_SECONDS: "1800"
      EVALUATION_INTERVAL_SECONDS: "3600"
      EVALUATION_TIMEOUT_SECONDS: "30"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agroclimate
          POSTGRES_USER: agroclimate
          POSTGRES_PASSWORD: local-dev-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agroclimate -d agroclimate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run mypy src tests

      - name: Test with PostgreSQL
        run: uv run pytest --cov --cov-report=term-missing

      - name: Build production image
        run: docker build --tag agroclimate:ci .
